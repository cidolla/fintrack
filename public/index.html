<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTrack — Controle de Gastos</title>
  <!-- Caminho absoluto para não dar erro 404 no CSS no Railway -->
  <link rel="stylesheet" href="/style.css">
  <!-- CDN do Chart.js para o gráfico -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>💰 FinTrack</h1>
  </header>

  <main>
    <!-- Cards de Resumo -->
    <section class="cards">
      <div class="card entrada">
        <h3>Entradas</h3>
        <p id="total-entradas">R$ 0,00</p>
      </div>
      <div class="card saida">
        <h3>Saídas</h3>
        <p id="total-saidas">R$ 0,00</p>
      </div>
      <div class="card saldo">
        <h3>Saldo</h3>
        <p id="saldo">R$ 0,00</p>
      </div>
    </section>

    <!-- Gráfico -->
    <section class="grafico-container">
      <h2>📊 Gastos por Categoria</h2>
      <canvas id="grafico"></canvas>
    </section>

    <!-- Formulário de Nova Transação -->
    <section class="form-container">
      <h2 id="form-titulo">Nova Transação</h2>
      <!-- O onsubmit chama a função salvarTransacao() corretamente -->
      <form onsubmit="event.preventDefault(); salvarTransacao();">
        <input type="hidden" id="edit-id">
        
        <input type="text" id="descricao" placeholder="Descrição (ex: roupa)" required>
        <input type="number" step="0.01" id="valor" placeholder="Valor (ex: 70)" required>
        
        <select id="tipo">
          <option value="entrada">Entrada</option>
          <option value="saida">Saída</option>
        </select>
        
        <select id="categoria">
          <option value="Alimentação">Alimentação</option>
          <option value="Transporte">Transporte</option>
          <option value="Lazer">Lazer</option>
          <option value="Saúde">Saúde</option>
          <option value="Educação">Educação</option>
          <option value="Outros">Outros</option>
        </select>
        
        <input type="date" id="data" required>

        <div class="botoes">
          <!-- ID btn-salvar é usado pelo seu app.js -->
          <button type="submit" id="btn-salvar">Adicionar</button>
          <!-- ID btn-cancelar é usado pelo seu app.js -->
          <button type="button" id="btn-cancelar" onclick="cancelarEdicao()" style="display: none;">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Filtro e Lista -->
    <section class="lista-container">
      <h2>Transações</h2>
      <select id="filtro" onchange="carregarTransacoes()">
        <option value="todos">Todas</option>
        <option value="entrada">Apenas Entradas</option>
        <option value="saida">Apenas Saídas</option>
      </select>
      <div id="lista"></div>
    </section>
  </main>

  <!-- Caminho absoluto para carregar o JS corretamente -->
  <script src="/app.js"></script>
</body>
</html>
